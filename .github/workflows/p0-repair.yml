name: P0 Website Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and apply P0 website changes
        shell: bash
        run: |
          git checkout d6ed6a6eb2c44d97b618b441f9d709ed1d3d3f1f -- index.html
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Private Android Beta', 'Private Beta')
          s = s.replace('A real look at the current Portfolio AICoPilot Android beta.', 'A real look at the current Portfolio AICoPilot beta.')
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/p0-repair.yml

      - name: Commit repaired site
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/p0-repair.yml
          git commit -m 'P0: restore website and update beta messaging' || exit 0
          git push
